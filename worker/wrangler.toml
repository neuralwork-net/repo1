name = "wsq-votes"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# D1 binding. Create the DB first (see worker/README.md), then paste the
# database_id printed by `wrangler d1 create` below.
[[d1_databases]]
binding = "DB"
database_name = "wsq-votes"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Optional: serve from a custom subdomain instead of *.workers.dev.
# Requires the zone to be on Cloudflare. Then set INTEGRATIONS.voteApi to
# 'https://api.worldsportsquiz.com' in src/lib/site.ts.
# routes = [
#   { pattern = "api.worldsportsquiz.com", custom_domain = true }
# ]
